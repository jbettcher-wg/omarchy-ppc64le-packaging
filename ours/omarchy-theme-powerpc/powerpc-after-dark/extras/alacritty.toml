white   = "#E4D8C0"

[colors.bright]
black   = "#6B5940"
red     = "#E4567C"
green   = "#6FBE99"
yellow  = "#E8CB8A"
blue    = "#9FBEDC"
magenta = "#D7AEC6"
cyan    = "#7FC8C0"
white   = "#FFFDF7"
