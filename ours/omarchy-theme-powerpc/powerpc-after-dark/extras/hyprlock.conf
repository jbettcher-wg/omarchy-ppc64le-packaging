# powerpc-after-dark lock screen.

$ink     = rgb(17120D)
$paper   = rgb(E4D8C0)
$crimson = rgb(C3325A)
$gold    = rgb(BE9E64)
$forest  = rgb(4E9C7A)

background {
    monitor =
    path = ~/.config/omarchy/current/theme/backgrounds/02-after-dark-omarchy.png
    blur_passes = 0
}

input-field {
    monitor =
    size = 420, 62
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.32
    dots_center = true
    outer_color = $crimson
    inner_color = $ink
    font_color = $paper
    check_color = $forest
    fail_color = $crimson
    placeholder_text = <span foreground="##A98C5F">password</span>
    fade_on_empty = false
    rounding = 8
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $paper
    font_size = 64
    font_family = IBM Plex Mono SemiBold
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = A DISTRIBUTION FOR THE GREATEST FAMILY OF RISC PROCESSORS
    color = $gold
    font_size = 13
    font_family = IBM Plex Mono
    position = 0, -140
    halign = center
    valign = center
}
