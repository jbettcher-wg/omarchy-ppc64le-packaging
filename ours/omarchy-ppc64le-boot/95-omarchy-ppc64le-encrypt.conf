# Unlock an encrypted root on POWER.
#
# omarchy-settings' ppc64le HOOKS line is the systemd initramfs with no
# encryption hook. Put sd-encrypt in front of filesystems, where systemd opens
# the volume /etc/crypttab.initramfs names before it mounts the root. On a
# system without one it does nothing. A HOOKS line that is not the systemd one
# is left alone: sd-encrypt needs systemd in the initramfs.
if [[ " ${HOOKS[*]} " == *" systemd "* && " ${HOOKS[*]} " != *" sd-encrypt "* && " ${HOOKS[*]} " == *" filesystems "* ]]; then
  _omarchy_hooks=()
  for _omarchy_hook in "${HOOKS[@]}"; do
    [[ $_omarchy_hook != filesystems ]] || _omarchy_hooks+=(sd-encrypt)
    _omarchy_hooks+=("$_omarchy_hook")
  done
  HOOKS=("${_omarchy_hooks[@]}")
  unset _omarchy_hooks _omarchy_hook
fi
