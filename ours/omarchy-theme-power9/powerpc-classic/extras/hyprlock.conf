# powerpc-classic lock screen. Paper ground, crimson focus ring.

$paper  = rgb(EFE6D4)
$ink    = rgb(3B3229)
$crimson = rgb(9E2044)
$forest = rgb(2A5D4C)
$beige  = rgb(E4D7BE)

background {
    monitor =
    path = ~/.config/omarchy/current/theme/backgrounds/02-quiet-paper.png
    blur_passes = 0
}

input-field {
    monitor =
    size = 420, 62
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.32
    dots_center = true
    outer_color = $crimson
    inner_color = $paper
    font_color = $ink
    check_color = $forest
    fail_color = $crimson
    placeholder_text = <span foreground="##6B5940">password</span>
    fade_on_empty = false
    rounding = 0
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $ink
    font_size = 64
    font_family = IBM Plex Mono SemiBold
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = A DISTRIBUTION FOR THE GREATEST FAMILY OF RISC PROCESSORS
    color = $forest
    font_size = 13
    font_family = IBM Plex Mono
    position = 0, -140
    halign = center
    valign = center
}
