# System-wide yt-dlp options (ppc64le). Your own ~/.config/yt-dlp/config
# adds to these.
#
# Solve YouTube's JavaScript challenges (yt-dlp-ejs) with bun, our
# JavaScriptCore port. yt-dlp has deprecated bun and warns that versions after
# 1.3.14 are unsupported; if solving fails, install quickjs-ng and change this
# to --js-runtimes quickjs. node is deliberately not used: its V8 miscompiles
# on ppc64le.
--js-runtimes bun
